name: Build Astra GameBoost APK

on:
  push:
    branches:
      - astra-gameboost-build-20260920
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode project
        run: |
          rm -rf build-src
          mkdir -p build-src
          base64 -d astra-gameboost-source.b64 > build-src/source.zip
          cd build-src
          unzip -q source.zip

      - name: Build debug APK
        working-directory: build-src/AstraGameBoost
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK to branch
        run: |
          mkdir -p dist
          cp build-src/AstraGameBoost/app/build/outputs/apk/debug/app-debug.apk dist/AstraGameBoost-Premium.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AstraGameBoost-Premium.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Astra GameBoost Premium APK"
            git push
          fi

name: Build Astra GameBoost APK

on:
  push:
    branches:
      - astra-gameboost-build-20260920
    paths:
      - "build-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: astra-gameboost
        shell: bash
        run: |
          set +e
          mkdir -p ../dist
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../dist/build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Publish APK and build log
        if: always()
        shell: bash
        run: |
          if [ -f astra-gameboost/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp astra-gameboost/app/build/outputs/apk/debug/app-debug.apk dist/AstraGameBoost-Premium.apk
          fi
          if [ ! -f dist/build.log ]; then
            echo "Build step did not produce a log." > dist/build.log
          fi
          echo "build_exit_code=${{ steps.build.outputs.exit_code }}" >> dist/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No new output"
          else
            git commit -m "Publish Astra GameBoost build output"
            git push
          fi
